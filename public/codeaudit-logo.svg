<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="auditGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <filter id="auditGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circular Base -->
  <circle cx="100" cy="100" r="96" fill="#000000" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />

  <!-- Outer Radar Scan Ring -->
  <circle cx="100" cy="100" r="76" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Shield Base for Security / Audit -->
  <path d="M 100 44 L 146 64 V 104 C 146 132 126 154 100 162 C 74 154 54 132 54 104 V 64 Z" fill="url(#auditGrad)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Left Code Bracket < -->
  <path d="M 88 88 L 76 100 L 88 112" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Code Bracket > -->
  <path d="M 112 88 L 124 100 L 112 112" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Slash / Audit Pulse -->
  <line x1="104" y1="84" x2="96" y2="116" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- Audit Verification Checkmark Badge -->
  <circle cx="138" cy="134" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="2" />
  <polyline points="132,134 136,138 144,129" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#auditGlow)" />
</svg>
