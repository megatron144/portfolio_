<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a1a1aa" />
      <stop offset="50%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circular Base -->
  <circle cx="100" cy="100" r="96" fill="#000000" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />

  <!-- Target / Radar Rings subtle -->
  <circle cx="100" cy="100" r="72" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Subtle Chart Gridlines -->
  <line x1="45" y1="75" x2="155" y2="75" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="45" y1="105" x2="155" y2="105" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="45" y1="135" x2="155" y2="135" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />

  <!-- Shaded Area Under Rating Curve -->
  <path d="M 48 135 L 48 126 L 76 112 L 104 122 L 132 78 L 152 60 L 152 135 Z" fill="url(#chartGrad)" />

  <!-- Rating Line Chart -->
  <path d="M 48 126 L 76 112 L 104 122 L 132 78 L 152 60" stroke="url(#lineGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Data Nodes -->
  <circle cx="48" cy="126" r="4.5" fill="#000000" stroke="#a1a1aa" stroke-width="2.5" />
  <circle cx="76" cy="112" r="4.5" fill="#000000" stroke="#d4d4d8" stroke-width="2.5" />
  <circle cx="104" cy="122" r="4.5" fill="#000000" stroke="#e4e4e7" stroke-width="2.5" />
  <circle cx="132" cy="78" r="4.5" fill="#000000" stroke="#ffffff" stroke-width="3" />
  <circle cx="152" cy="60" r="6.5" fill="#ffffff" filter="url(#glow)" />

  <!-- Target Indicator Arrow in top right -->
  <path d="M 140 46 L 158 46 L 158 64" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="158" y1="46" x2="138" y2="66" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
</svg>
